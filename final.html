<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV Builder — Final CV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- Fixed Navbar (authenticated) -->
  <nav class="dash-navbar fixed-top">
    <div class="dash-nav-inner">
      <!-- <div class="brand">
        <img src="https://via.placeholder.com/36" alt="logo" class="brand-logo"/>
        <strong class="brand-name">CV Builder</strong>
      </div> -->
      <div class="nav-actions">
        <label class="switch" title="Toggle theme">
          <input id="navThemeToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
        <button id="createBtn" class="btn btn-sm btn-primary">Create</button>
        <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
      </div>
    </div>
  </nav>

  <main class="final-page">
    <div class="cv-actions">
      <button id="saveHtmlBtn" class="btn secondary">Save (HTML)</button>
      <button id="downloadPdfBtn" class="btn">Download PDF</button>
    </div>

    <div id="cvContainer" style="background:#fff;padding:18px;border-radius:8px;min-height:600px;box-shadow:0 6px 30px rgba(44,62,80,0.06)"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
  <script src="assets/js/final.js"></script>
</body>
</html>
