<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV Builder — Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- Fixed Navbar (authenticated) -->
  <nav class="dash-navbar fixed-top">
    <div class="dash-nav-inner">
      <!-- <div class="brand">
        <img src="https://via.placeholder.com/36" alt="logo" class="brand-logo"/>
        <strong class="brand-name">CV Builder</strong>
      </div> -->
      <div class="nav-actions">
        <label class="switch" title="Toggle theme">
          <input id="navThemeToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
        <button id="createBtn" class="btn btn-sm btn-primary">Create</button>
        <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
      </div>
    </div>
  </nav>

  <main class="form-page">
    <div class="form-grid">
      <section class="form-panel main-panel">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h2>Your Information</h2>
          <div style="display:flex;gap:10px;align-items:center">
            <button id="themeToggle" class="btn secondary">Toggle Theme</button>
            <button id="saveCvBtn" class="btn secondary">Save CV</button>
          </div>
        </div>
        <form id="cvForm" class="form">
          <div class="form-field"><label>Title (Resume title)</label><input id="title" placeholder="e.g., Senior Frontend Developer"/></div>
          <div class="form-field"><label>Full Name</label><input id="fullName" required/></div>
          <div class="form-field"><label>Father Name</label><input id="fatherName"/></div>
          <div class="form-field"><label>Age</label><input id="age" type="number"/></div>
          <div class="form-field"><label>Education (summary)</label><textarea id="education" rows="2"></textarea></div>
          <div class="form-field"><label>Experience (summary)</label><textarea id="experience" rows="3"></textarea></div>
          <div class="form-field"><label>Profile Summary</label><textarea id="profile" rows="3" placeholder="Short professional summary"></textarea></div>
          <div class="form-field"><label>Date of Birth</label><input id="dob" type="date"/></div>
          <div class="form-field"><label>CNIC</label><input id="cnic"/></div>
          <div class="form-field"><label>Religion</label><input id="religion" placeholder="e.g., Islam, Christianity"/></div>
          <div class="form-field"><label>Phone Number</label><input id="phone"/></div>
          <div class="form-field"><label>Languages</label><input id="languages" placeholder="Comma separated (e.g., English, Urdu)"/></div>
          <div class="form-field"><label>Skills</label><input id="skills" placeholder="Comma separated"/></div>

          <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
            <button id="saveBtn" type="button" class="btn">Save Draft</button>
            <button id="saveCvBtn" type="button" class="btn secondary">Save CV</button>
            <button id="applyBtn" type="button" class="btn secondary">Apply to Template</button>
          </div>
        </form>
      </section>
    </div>

    <section class="templates-section">
      <div class="templates-wrap">
        <div class="side-panel form-panel">
          <h2>Saved CVs</h2>
          <div id="savedList" style="display:grid;gap:10px;margin-bottom:12px">
            <!-- Saved CVs will appear here -->
          </div>
        </div>
        <div class="templates-panel form-panel">
          <!-- <div style="display:flex;align-items:center;justify-content:space-between">
            <h2>CV Templates</h2>
            <button id="toggleSaved" class="btn secondary" title="Show Saved CVs" style="font-size:13px;padding:6px">Saved</button>
          </div>
          <p class="muted">Pick a template and click <strong>Apply</strong> to generate your CV.</p> -->

          <div class="templates-grid" id="templatesGrid">
            <!-- Template cards will be loaded here
            Inline back button as a centered grid item -->
            <a href="dashboard.html" class="back-box" aria-label="Back to Dashboard">⬅ Back to Dashboard</a>
          </div>

        </div>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/form.js"></script>
</body>
</html>
