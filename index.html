<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV Builder — Login / Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="card auth-card">
      <h1>Welcome to CV Builder</h1>
      <p class="muted">Create professional CVs in seconds — sign up or log in to continue.</p>

      <div class="auth-tabs">
        <button id="signinTab" class="tab active">Login</button>
        <button id="signupTab" class="tab">Sign Up</button>
      </div>

      <form id="authForm" class="auth-form">
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" type="password" required minlength="6" />
        </div>

        <div id="extraSignup" class="hidden">
          <div class="form-row">
            <label for="name">Full Name</label>
            <input id="name" type="text" />
          </div>
          <div class="form-row">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password" minlength="6" />
          </div>
        </div>

        <div class="form-actions">
          <button id="submitBtn" class="btn">Login</button>
        </div>

        <p id="message" class="message"></p>
      </form>
    </div>
  </main>

  <script src="assets/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Index theme toggle
    const idxToggle = document.getElementById('indexThemeToggle');
    function applyIndexTheme(){ const t = localStorage.getItem('cv_theme') || 'dark'; if(t==='light') document.body.classList.add('light'); else document.body.classList.remove('light'); }
    idxToggle?.addEventListener('click', ()=>{ const next = document.body.classList.contains('light') ? 'dark' : 'light'; localStorage.setItem('cv_theme', next); applyIndexTheme(); });
    applyIndexTheme();
  </script>
</body>
</html>
