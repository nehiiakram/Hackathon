<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CV | Tech Minimal</title>
    <link rel="stylesheet" href="css/template3.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="a4-page">
        <div class="top-bar"></div>
        <div class="container">
            <header>
                <h1 id="cv-name"></h1>
                <p class="subtitle" id="cv-title">DEVELOPER</p>
                <div class="contact-grid">
                    <span><i class="fas fa-envelope"></i> <span id="cv-email"></span></span>
                    <span><i class="fas fa-phone"></i> <span id="cv-phone"></span></span>
                </div>
            </header>

            <div class="grid-layout">
                <main>
                    <section>
                        <h3 class="heading-accent">EDUCATION</h3>
                        <p id="cv-education"></p>
                    </section>
                    <section>
                        <h3 class="heading-accent">WORK EXPERIENCE</h3>
                        <p id="cv-experience"></p>
                    </section>
                </main>

                <aside>
                    <section>
                        <h4 class="sidebar-head">PERSONAL</h4>
                        <ul class="clean-list">
                            <li><small>Father</small><br><span id="cv-father"></span></li>
                            <li><small>CNIC</small><br><span id="cv-cnic"></span></li>
                            <li><small>Born</small><br><span id="cv-dob"></span></li>
                        </ul>
                    </section>
                    <section>
                        <h4 class="sidebar-head">SKILLS</h4>
                        <div id="cv-skills" class="tags-cloud"></div>
                    </section>
                </aside>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
