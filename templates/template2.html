<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CV | Executive</title>
    <link rel="stylesheet" href="css/template2.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="a4-page">
        <header>
            <div class="header-content">
                <h1 id="cv-name">JOHN DOE</h1>
                <p id="cv-title">Professional Title</p>
            </div>
            <div class="header-contact">
                <div><i class="fas fa-envelope"></i> <span id="cv-email"></span></div>
                <div><i class="fas fa-phone"></i> <span id="cv-phone"></span></div>
            </div>
        </header>

        <section class="personal-details">
            <div class="detail-box">
                <label>Date of Birth</label>
                <span id="cv-dob"></span>
            </div>
            <div class="detail-box">
                <label>CNIC</label>
                <span id="cv-cnic"></span>
            </div>
            <div class="detail-box">
                <label>Father's Name</label>
                <span id="cv-father"></span>
            </div>
        </section>

        <div class="main-body">
            <section>
                <h2 class="section-title">Experience History</h2>
                <div class="content" id="cv-experience"></div>
            </section>

            <section>
                <h2 class="section-title">Education & Qualifications</h2>
                <div class="content" id="cv-education"></div>
            </section>

            <section>
                <h2 class="section-title">Competencies & Skills</h2>
                <div class="skills-content" id="cv-skills"></div>
            </section>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
