<div class="cv-template t2">

      <h2 data-field="fullName" class="h4">Jane Smith</h2>
      <div class="text-muted" data-field="education">M.A. Communication</div>
    </div>
    <div class="t2-main row">
      <div class="t2-left col-md-8">
      <h6>Experience</h6>

    </div>
  </div>
