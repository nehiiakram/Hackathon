<div class="cv-template t1">
  <div class="cv-shell p-3">
    <div class="t1-header d-flex justify-content-between align-items-center mb-3">
      <div class="t1-name"> <h1 data-field="fullName" class="h4">John Doe</h1></div>
      <div class="t1-contact text-muted"><p data-field="phone">+0 000 000 0000</p></div>
    </div>
    <div class="t1-body row">
      <div class="t1-left col-md-8">
        <h6>Profile</h6>
      <p data-field="experience">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed non risus.</p>
      <h6>Skills</h6>
      <p data-field="skills">HTML, CSS, JavaScript</p>
      <h6>Languages</h6>
      <p data-field="languages">English, Urdu</p>
    </div>
    <div class="t1-right col-md-4 bg-light p-2 rounded">
      <p class="mb-1"><strong>Father:</strong> <span data-field="fatherName">Father Name</span></p>
      <p class="mb-1"><strong>Age:</strong> <span data-field="age">30</span></p>
      <p class="mb-1"><strong>Education:</strong> <span data-field="education">B.Sc in CS</span></p>
      <p class="mb-1"><strong>DOB:</strong> <span data-field="dob">1990-01-01</span></p>
      <p class="mb-1"><strong>CNIC:</strong> <span data-field="cnic">00000-0000000-0</span></p>
      <p class="mb-0"><strong>Religion:</strong> <span data-field="religion">Islam</span></p>
    </div>
  </div>
</div>
